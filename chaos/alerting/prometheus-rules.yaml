# Alert rules on the OpenTelemetry Demo's spanmetrics. Add them to the demo's Prometheus
# (prometheus.serverFiles."alerting_rules.yml" in the Helm values) or as a PrometheusRule.
groups:
- name: oncall-copilot
  rules:
  - alert: CheckoutHighErrorRate
    expr: |
      sum(rate(traces_span_metrics_calls_total{service_name="checkout",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}[2m]))
        / sum(rate(traces_span_metrics_calls_total{service_name="checkout",span_kind="SPAN_KIND_SERVER"}[2m])) > 0.05
    for: 2m
    labels: {severity: critical, service_name: checkout}
    annotations: {summary: "checkout error rate > 5% for 2m"}
  - alert: FrontendHighErrorRate
    expr: |
      sum(rate(traces_span_metrics_calls_total{service_name="frontend",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}[2m]))
        / sum(rate(traces_span_metrics_calls_total{service_name="frontend",span_kind="SPAN_KIND_SERVER"}[2m])) > 0.02
    for: 2m
    labels: {severity: critical, service_name: frontend}
    annotations: {summary: "frontend 5xx ratio > 2% for 2m"}
  - alert: ServiceLatencyHigh
    expr: |
      histogram_quantile(0.95, sum by (le, service_name) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER",service_name=~"frontend|checkout|shipping|frontend-proxy"}[5m]))) > 1000
    for: 5m
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.service_name }} p95 latency > 1s for 5m"}
  - alert: ConsumerLagHigh
    # needs a Kafka lag exporter (e.g. danielqsj/kafka-exporter)
    expr: sum by (consumergroup) (kafka_consumergroup_lag) > 1000
    for: 2m
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.consumergroup }} consumer lag > 1000 messages"}
