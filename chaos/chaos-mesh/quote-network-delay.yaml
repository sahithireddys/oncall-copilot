apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: quote-network-delay
  namespace: otel-demo
spec:
  action: delay
  mode: all
  selector:
    namespaces: [otel-demo]
    labelSelectors:
      app.kubernetes.io/name: quote
  delay:
    latency: "1600ms"
    jitter: "200ms"
    correlation: "25"
  direction: to
  duration: "30m"
