[project]
name = "oncall-copilot"
version = "0.1.0"
description = "AI on-call copilot for Kubernetes: investigates alerts across traces, logs, metrics, K8s events and deploys, and proposes a root cause."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.3",
    "langchain-anthropic>=0.3",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
live = ["kubernetes>=30.1"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["copilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
