# Runs the copilot inside the cluster next to the OpenTelemetry Demo, with read-only RBAC.
#   docker build -t oncall-copilot:dev . && kind load docker-image oncall-copilot:dev --name otel
#   kubectl -n otel-demo create secret generic copilot-secrets --from-literal=ANTHROPIC_API_KEY=sk-... --from-literal=SLACK_WEBHOOK_URL=
#   kubectl apply -f deploy/copilot.yaml
apiVersion: v1
kind: ServiceAccount
metadata: {name: oncall-copilot, namespace: otel-demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: oncall-copilot-read, namespace: otel-demo}
rules:
- apiGroups: [""]
  resources: [events, pods, configmaps, services, endpoints]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, replicasets]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: oncall-copilot-read, namespace: otel-demo}
subjects: [{kind: ServiceAccount, name: oncall-copilot, namespace: otel-demo}]
roleRef: {kind: Role, name: oncall-copilot-read, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: oncall-copilot, namespace: otel-demo, labels: {app.kubernetes.io/name: oncall-copilot}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: oncall-copilot}}
  template:
    metadata: {labels: {app.kubernetes.io/name: oncall-copilot}}
    spec:
      serviceAccountName: oncall-copilot
      containers:
      - name: copilot
        image: oncall-copilot:dev
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        env:
        - {name: TELEMETRY_MODE, value: live}
        - {name: K8S_NAMESPACE, value: otel-demo}
        - {name: PROMETHEUS_URL, value: "http://prometheus:9090"}
        - {name: JAEGER_URL, value: "http://jaeger-query:16686/jaeger/ui"}
        - {name: OPENSEARCH_URL, value: "http://opensearch:9200"}
        - {name: DATABASE_PATH, value: /data/copilot.db}
        envFrom: [{secretRef: {name: copilot-secrets, optional: true}}]
        readinessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 10}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 512Mi}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: oncall-copilot, namespace: otel-demo}
spec:
  selector: {app.kubernetes.io/name: oncall-copilot}
  ports: [{port: 8000, targetPort: 8000}]
