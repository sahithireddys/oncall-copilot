- id: frontend-bad-deploy
  title: Frontend release breaks product pages for some currencies
  difficulty: medium
  tags: [deploy, red-herring]
  alert: {name: FrontendProxyHighErrorRate, service: frontend-proxy, severity: critical, summary: "frontend-proxy 5xx ratio > 2% for 5m"}
  faults:
    - {service: frontend, type: bad_deploy, onset_min: -9, error_rate: 0.07, latency_ms: 10,
       version_from: "2.0.3", version_to: "2.0.4",
       error_message: "TypeError: Cannot read properties of null (reading 'currencyCode') at ProductPrice.tsx:22"}
  noise:
    - {type: config_change, service: currency, at_min: -5, message: configmap/currency-config, config_key: DEFAULT_CURRENCY, config_old: "USD", config_new: "USD"}
  ground_truth:
    service: frontend
    category: bad_deploy
    fix: kubectl -n otel-demo rollout undo deployment/frontend
  reproduce:
